name: Cloudflare reservations
on:
  push:
    branches: [main, cloudflare-reservations]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passala-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Worker types
        run: npm run types
      - name: Type check
        run: npm run check
      - name: Reservation integrity tests
        run: npm test
      - name: Deploy D1 and Worker
        run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || vars.NOTIFY_EMAIL }}
          WRANGLER_SEND_METRICS: 'false'
